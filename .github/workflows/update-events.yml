name: 공연 일정 자동 갱신

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 05:17 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: 공연 일정 받기 (이번 달부터 3개월)
        run: python3 -I scripts/fetch_events.py data_raw/events.json 3
      - name: 화면 데이터 다시 만들기
        run: python3 -I scripts/build_data.py data_raw olpark.json
      - name: 바뀐 것이 있으면 저장
        run: |
          if git diff --quiet -- data_raw/events.json; then
            echo "공연 일정 변화 없음"; exit 0
          fi
          git config user.name "olpark-bot"
          git config user.email "olpark-bot@users.noreply.github.com"
          git add data_raw/events.json olpark.json
          git commit -m "공연 일정 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git push
